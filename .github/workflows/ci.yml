name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Tests and eval gate
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache eval models
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/dora/eval-models
          key: dora-eval-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            dora-eval-models-${{ runner.os }}-${{ runner.arch }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Check build
        run: cargo check

      - name: Run tests and retrieval evals
        run: scripts/eval.sh
