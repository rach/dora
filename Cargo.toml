[package]
name = "dora-fs"
version = "0.2.2"
edition = "2021"
description = "Personal semantic memory for notes and code — single Rust binary, tree-sitter code chunking, MCP-first."
license = "MIT"

[[bin]]
name = "dora"
path = "src/main.rs"

[dependencies]
rusqlite   = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
fastembed  = "4"
walkdir    = "2"
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
regex      = "1"
toml       = "0.8"
reqwest    = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2       = "0.10"
tokio      = { version = "1", default-features = false, features = ["rt", "macros", "io-std"] }
rmcp       = { version = "1.7", features = ["server", "transport-io"] }
schemars   = "1"
dirs       = "5"
notify     = "6"

# Code chunking (v0.2). tree-sitter + per-language grammars. tree-sitter-tags reads each
# grammar's queries/tags.scm to find definitions/references — we don't write those queries.
tree-sitter            = "0.25"
tree-sitter-tags       = "0.25"
tree-sitter-rust       = "0.24"
tree-sitter-python     = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go         = "0.23"
tree-sitter-java       = "0.23"
tree-sitter-ruby       = "0.23"

[profile.release]
lto = "thin"
codegen-units = 1
