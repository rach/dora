[package]
name = "dora-fs"
version = "0.1.0"
edition = "2021"
description = "Personal memory for an Obsidian vault — semantic grep + MCP, single binary, local-only."
license = "MIT"

[[bin]]
name = "dora"
path = "src/main.rs"

[dependencies]
rusqlite   = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
fastembed  = "4"
walkdir    = "2"
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
regex      = "1"
toml       = "0.8"
reqwest    = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2       = "0.10"
tokio      = { version = "1", default-features = false, features = ["rt", "macros", "io-std"] }
rmcp       = { version = "1.7", features = ["server", "transport-io"] }
schemars   = "1"
dirs       = "5"
notify     = "6"

[profile.release]
lto = "thin"
codegen-units = 1
